<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dota 2 录像复盘</title><style>
:root{color-scheme:dark;--bg:#10171b;--panel:#1a252a;--ink:#e5eceb;--muted:#a1b3b6;--line:#345057;--r:#60c6a4;--d:#ec9a81}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}
header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 12px}small,.muted{color:var(--muted)}main{display:grid;grid-template-columns:minmax(340px,1.2fr) minmax(330px,1fr);gap:16px;padding:16px;max-width:1600px;margin:auto}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}.full{grid-column:1/-1}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}input[type=range]{flex:1;min-width:160px}select{background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:6px;border-radius:6px}
#map{width:100%;aspect-ratio:1;background:#1a302e;border:1px solid var(--line);border-radius:6px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}th{color:var(--muted);font-weight:600}tbody tr:hover{background:#25343a}.scroll{max-height:390px;overflow:auto}.tag{border-radius:4px;padding:2px 6px;background:#304850;color:#d7e5e4;white-space:nowrap}.r{color:var(--r)}.d{color:var(--d)}.cards{display:flex;gap:10px;flex-wrap:wrap}.card{background:#223139;border:1px solid var(--line);border-radius:7px;padding:10px;flex:1;min-width:180px}.card b{display:block;font-size:17px}button{background:#335b62;color:var(--ink);border:0;border-radius:6px;padding:7px 12px;cursor:pointer}button:hover{background:#40727a}
@media(max-width:850px){main{display:block}section{margin-bottom:14px}}
</style></head><body>
<header><div><h1 id="title">录像复盘</h1><small id="subtitle"></small></div><span class="tag" id="status"></span></header>
<main>
<section><h2>地图时间轴</h2><canvas id="map" width="720" height="720" aria-label="比赛坐标示意图"></canvas><div class="controls"><b id="time">00:00</b><input id="slider" type="range" min="-90" step="1"><select id="perspective"><option value="all">双方对比</option><option value="2">天辉</option><option value="3">夜魇</option></select></div><small>坐标示意图；眼位仅在有证据的存续区间显示。轨迹最长沿用 4 秒。</small></section>
<section><h2>事件时间轴</h2><div class="controls"><select id="eventType"><option value="all">全部事件</option><option value="rune">神符</option><option value="smoke">开雾</option><option value="kill">击杀</option><option value="objective">目标</option><option value="pull">拉野候选</option></select></div><div class="scroll"><table><thead><tr><th>时间</th><th>队伍</th><th>事件</th><th>证据</th></tr></thead><tbody id="events"></tbody></table></div></section>
<section class="full"><h2>重点窗口</h2><div class="cards" id="runes"></div></section>
<section><h2>Carry 经济与刷钱</h2><div class="scroll"><table><thead><tr><th>时间</th><th>英雄</th><th>经济</th><th>位置</th></tr></thead><tbody id="carry"></tbody></table></div></section>
<section><h2>联动</h2><div class="scroll"><table><thead><tr><th>队伍</th><th>组合</th><th>次数</th><th>总时长</th></tr></thead><tbody id="links"></tbody></table></div></section>
<section><h2>开雾行动</h2><div class="scroll"><table><thead><tr><th>时间</th><th>准备</th><th>行进</th><th>后续收益</th></tr></thead><tbody id="smokes"></tbody></table></div></section>
<section><h2>BP</h2><p id="bpModel" class="muted">预测数据不足</p><div id="bpTraits" class="cards"></div><div class="scroll"><table><thead><tr><th>轮次</th><th>队伍</th><th>动作</th><th>英雄</th></tr></thead><tbody id="draft"></tbody></table></div></section>
<section class="full"><h2>兵线与拉野</h2><p id="creeps" class="muted"></p><div class="scroll"><table><thead><tr><th>时间</th><th>队伍</th><th>野区</th><th>证据</th></tr></thead><tbody id="pulls"></tbody></table></div></section>
</main><script type="application/json" id="data">__MATCH_JSON__</script><script>
const d=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),slider=$('slider'),canvas=$('map'),ctx=canvas.getContext('2d');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{if(s==null)return '?';let n=Math.abs(Math.trunc(s));return (s<0?'-':'')+String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};
const team=t=>t===2?'天辉':t===3?'夜魇':'?';const color=t=>t===2?'#60c6a4':'#ec9a81';
const mapX=x=>Math.max(0,Math.min(720,(x-7563)/(25900-7563)*720)),mapY=y=>720-Math.max(0,Math.min(720,(y-7800)/(25600-7800)*720));
function draw(){let t=+slider.value,side=$('perspective').value;$('time').textContent=fmt(t);ctx.clearRect(0,0,720,720);ctx.fillStyle='#1a302e';ctx.fillRect(0,0,720,720);
ctx.strokeStyle='#38544d';ctx.lineWidth=22;ctx.beginPath();ctx.moveTo(75,70);ctx.lineTo(75,645);ctx.lineTo(645,645);ctx.stroke();ctx.beginPath();ctx.moveTo(75,70);ctx.lineTo(645,70);ctx.lineTo(645,645);ctx.stroke();ctx.beginPath();ctx.moveTo(80,640);ctx.lineTo(640,80);ctx.stroke();ctx.strokeStyle='#58716d';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(50,450);ctx.lineTo(450,50);ctx.stroke();ctx.fillStyle='#9ab1ad';ctx.font='16px sans-serif';ctx.fillText('天辉',36,683);ctx.fillText('夜魇',626,36);
for(let w of d.wards){if(w.time_s>t || (w.end_s!=null&&t>=w.end_s)|| (side!=='all'&&String(w.team)!==side)||w.x==null||w.y==null)continue;ctx.strokeStyle=color(w.team);ctx.lineWidth=2;ctx.beginPath();ctx.arc(mapX(w.x),mapY(w.y),w.kind==='observer'?9:6,0,7);ctx.stroke();}
for(let cr of d.creep_at_time[Math.floor(t/2)*2]||[]){if(side!=='all'&&cr[3]!==0&&String(cr[3])!==side)continue;ctx.fillStyle=cr[4]==='n'?'#b5bba3':color(cr[3]);ctx.fillRect(mapX(cr[1])-2,mapY(cr[2])-2,4,4)}
for(let o of d.observations||[]){if(o.type!=='pull'||o.time_s==null||o.end_s==null||!(o.time_s<=t&&t<o.end_s)||o.details.x==null)continue;ctx.strokeStyle='#e8c76a';ctx.lineWidth=3;ctx.strokeRect(mapX(o.details.x)-9,mapY(o.details.y)-9,18,18)}
for(let p of d.players){if(side!=='all'&&String(p.team)!==side)continue;let rows=d.positions[String(p.slot)]||[],lo=0,hi=rows.length;while(lo<hi){let m=(lo+hi)>>1;if(rows[m].time_s<=t)lo=m+1;else hi=m}let q=rows[lo-1];if(!q||t-q.time_s>4)continue;let x=mapX(q.x),y=mapY(q.y);ctx.fillStyle=color(p.team);ctx.beginPath();ctx.arc(x,y,11,0,7);ctx.fill();ctx.fillStyle='#10171b';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText(String(p.role||'?'),x,y+4);ctx.textAlign='left';}}
function rows(){let side=$('perspective').value,type=$('eventType').value,t=+slider.value;let events=d.timeline_events.filter(e=>(side==='all'||String(e.team)===side||e.team==null)&&(type==='all'||e.type===type));$('events').innerHTML=events.map(e=>`<tr data-time="${e.time_s}"><td>${fmt(e.time_s)}</td><td>${team(e.team)}</td><td>${esc(e.description||e.subtype||e.type)}</td><td>${esc(e.evidence)}</td></tr>`).join('');$('events').querySelectorAll('tr').forEach(tr=>tr.onclick=()=>{slider.value=tr.dataset.time;draw()});
let carry=d.players.filter(p=>p.role===1&&(side==='all'||String(p.team)===side));$('carry').innerHTML=carry.flatMap(p=>(d.economy[String(p.slot)]||[]).filter(e=>e.time_s%60===0||Math.abs(e.time_s-t)<15).map(e=>`<tr><td>${fmt(e.time_s)}</td><td>${esc(p.hero)}</td><td>${e.net_worth??'?'}</td><td>${(()=>{let a=d.positions[String(p.slot)]||[],q=a.find(x=>x.time_s>=e.time_s);return q?Math.round(q.x)+','+Math.round(q.y):'?'})()}</td></tr>`)).join('');
let totals={};for(let link of d.companionship){if(side!=='all'&&String(link.team)!==side)continue;let k=link.team+'|'+link.roles;(totals[k]??={team:link.team,roles:link.roles,count:0,seconds:0}).count++;totals[k].seconds+=link.duration_s}$('links').innerHTML=Object.values(totals).map(x=>`<tr><td>${team(x.team)}</td><td>${x.roles}</td><td>${x.count}</td><td>${fmt(x.seconds)}</td></tr>`).join('');}
d.creep_at_time={};for(let cr of d.creeps||[])(d.creep_at_time[cr[0]]??=[]).push(cr);
d.timeline_events=[...d.events,...(d.observations||[]).filter(o=>o.type==='pull'&&o.time_s!=null).map(o=>({time_s:o.time_s,team:o.team,type:'pull',description:'拉野候选 · 野区 '+o.details.camp_id,evidence:o.evidence}))].sort((a,b)=>a.time_s-b.time_s);
slider.min=Math.min(-90,...d.events.map(e=>e.time_s));slider.max=d.duration_s;slider.value=0;$('title').textContent=(d.radiant_name||'天辉')+' vs '+(d.dire_name||'夜魇');const started=d.metadata.start_time?new Date(d.metadata.start_time*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})+' 北京时间':'比赛时间待核实';$('subtitle').textContent=started+' · '+(d.metadata.league_name||'赛事名称待核实')+' · ID '+(d.match_id||d.filename)+' · '+fmt(d.duration_s)+' · '+(d.patch||'版本未知');$('status').textContent=d.metadata.patch_method==='major_patch_and_release_window'?'7.41f 时间窗口推定':'版本未验证';
$('runes').innerHTML=d.rune_windows.map(w=>`<div class="card"><b>${esc(w.label)}</b><span>${fmt(w.start_s)}–${fmt(w.end_s)}</span><p>${w.pickups.length?esc(w.pickups.map(p=>p.description||p.subtype).join('；')):'拾取证据不足'}</p><small>站位样本 ${w.positions.length} · 到场证据 ${w.attendance.length||'不足'} · 后续事件 ${w.followups.length}（非因果）</small></div>`).join('');
$('smokes').innerHTML=d.smoke_followups.map(s=>`<tr><td>${fmt(s.time_s)}</td><td>${esc(s.preparation)}</td><td>${esc(s.movement)}</td><td>${esc(s.outcome)}</td></tr>`).join('');
$('bpModel').textContent=d.bp_prediction?`天辉胜率预测 ${(d.bp_prediction.radiant_probability*100).toFixed(1)}% · 验证 Brier ${d.bp_prediction.brier.toFixed(3)} · ECE ${d.bp_prediction.ece.toFixed(3)} · 7.41f 时间窗口推定`:'预测数据不足';
$('bpTraits').innerHTML=[2,3].map(side=>{let x=d.bp_descriptors[side];return `<div class="card"><b>${team(side)}</b><small>开团工具：${esc(x.initiation_tools.join('、')||'未标注')}<br>推进/终结工具：${esc(x.siege_tools.join('、')||'未标注')}<br>标签覆盖 ${esc(x.coverage)}</small></div>`}).join('');
$('draft').innerHTML=d.draft.map((x,i)=>`<tr><td>${i+1}</td><td>${team(x.team)}</td><td>${esc(x.action)}</td><td>${esc(x.hero)}</td></tr>`).join('');
$('creeps').textContent=(d.observations||[]).filter(x=>(x.type==='pull'||x.type==='lane')&&x.evidence!=='insufficient').length?'仅展示有实体证据的候选片段；请对照原始录像核查。':'证据不足：当前解析结果没有足够的小兵和野怪实体轨迹，无法判断兵线位置或拉野。';
$('pulls').innerHTML=(d.observations||[]).filter(o=>o.type==='pull'&&o.time_s!=null).map(o=>`<tr><td>${fmt(o.time_s)}–${fmt(o.end_s)}</td><td>${team(o.team)}</td><td>${esc(o.details.camp_id)}</td><td>${esc(o.evidence)}</td></tr>`).join('');
slider.oninput=()=>{draw();rows()};$('perspective').onchange=()=>{draw();rows()};$('eventType').onchange=rows;draw();rows();
</script></body></html>
